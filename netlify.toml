[[redirects]]
  from = "/visa"
  to = "/articles/fr/visa-thailande.html"
  status = 301

[[redirects]]
  from = "/assurance"
  to = "/articles/fr/assurance-sante-expatrie-thailande.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    # HTML : toujours revalider pour que les mises à jour de contenu soient
    # visibles immédiatement (Netlify renvoie 304 si rien n'a changé).
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
